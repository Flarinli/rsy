name: Update Homebrew

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  update-homebrew:
    name: Update Homebrew Tap
    if: github.event.release.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nijaru/homebrew-tap
          token: ${{ secrets.TAP_UPDATE_TOKEN }}

      - name: Download checksums
        run: |
          gh release download "$TAG" \
            --repo Flarinli/rsy \
            --pattern '*.sha256'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update formula
        run: |
          VERSION=${TAG#v}

          ARM64_SHA=$(cat rsy-aarch64-apple-darwin.tar.gz.sha256 | awk '{print $1}')
          SOURCE_SHA=$(curl -fsSL "https://github.com/Flarinli/rsy/archive/refs/tags/$TAG.tar.gz" | shasum -a 256 | awk '{print $1}')

          sed -i "s/version \".*\"/version \"$VERSION\"/" Formula/rsy.rb
          sed -i "s|url \"https://github.com/Flarinli/rsy/releases/download/v.*/rsy-aarch64-apple-darwin.tar.gz\"|url \"https://github.com/Flarinli/rsy/releases/download/$TAG/rsy-aarch64-apple-darwin.tar.gz\"|" Formula/rsy.rb
          sed -i "/on_arm do/,/end/ s/sha256 \".*\"/sha256 \"$ARM64_SHA\"/" Formula/rsy.rb
          sed -i "s|url \"https://github.com/Flarinli/rsy/archive/refs/tags/v.*.tar.gz\"|url \"https://github.com/Flarinli/rsy/archive/refs/tags/$TAG.tar.gz\"|" Formula/rsy.rb
          sed -i "/on_intel do/,/depends_on/ s/sha256 \".*\"/sha256 \"$SOURCE_SHA\"/" Formula/rsy.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rsy.rb
          git commit -m "chore: update rsy to $TAG"
          git push
